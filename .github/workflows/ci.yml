# Builds QB Brain and runs the whole test suite on every push and pull request.
# Fails if a test fails, or if the committed index.html/sw.js weren't rebuilt from src/.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Built files are up to date
        run: |
          if ! git diff --quiet -- index.html sw.js; then
            echo "::error::index.html / sw.js are out of date. Run 'npm run build' and commit the result."
            git diff --stat -- index.html sw.js
            exit 1
          fi

      - name: Engine tests (headless)
        run: npm run test:unit

      - name: Browser tests (Chromium, iPhone-sized)
        run: npm run test:e2e

      - name: Keep screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/out/
          if-no-files-found: ignore
